[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-compression-tcc"
version = "0.1.0"
description = "Semantic compression of LLM outputs for BPMN 2.0 generation"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2",
    "lxml>=5.0",
    "networkx>=3.3",
    "python-dotenv>=1.2.2",
    # Wilcoxon pareado da spec 003 §6.3. Implementar à mão exigiria acertar
    # tratamento de empates e de diferenças nulas — risco desnecessário na
    # afirmação estatística central da tese, e não é o que um revisor espera ver.
    "scipy>=1.14",
]

[project.optional-dependencies]
training = [
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=0.12",
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "bitsandbytes>=0.44",
]

# uv installs the "dev" dependency-group automatically on `uv sync`
[dependency-groups]
dev = [
    "gdown>=5.2.1",
    "huggingface-hub>=1.9.0",
    "pyarrow>=23.0.1",
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
