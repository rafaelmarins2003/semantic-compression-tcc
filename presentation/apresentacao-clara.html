<style>
/* Palco fixo de 1920×1080, escalado para a janela. Cada slide: rótulo do ato, uma
   manchete e uma figura. Serifa = linguagem humana; mono = notação; sans = dados. */
:root {
  color-scheme: dark;
  --bg: #0a1022;
  --bg-glow: #121d40;
  --surface: #101a36;
  --surface-2: #16224a;
  --raise: #1c2a58;
  --line: rgba(160, 182, 236, 0.16);
  --line-2: rgba(160, 182, 236, 0.36);
  --grid: rgba(160, 182, 236, 0.1);
  --ink: #edf1fb;
  --ink-2: #b4c0dd;
  --ink-3: #7c89ad;
  --hl: rgba(160, 182, 236, 0.26);
  /* categorias (validadas: CVD e contraste nos dois temas) */
  --xml: #dd6a2a;
  --dsl: #4189e6;
  --slm: #1aa58f;
  --xml-ink: #f1a67e;
  --dsl-ink: #8fb9f5;
  --slm-ink: #6cd2bf;
  /* estado: sempre com ícone e rótulo */
  --good: #35b85c;
  --bad: #e5534b;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-sans: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", Menlo, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5fa;
  --bg-glow: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --raise: #ffffff;
  --line: rgba(18, 38, 100, 0.14);
  --line-2: rgba(18, 38, 100, 0.34);
  --grid: rgba(18, 38, 100, 0.1);
  --ink: #0f1b3d;
  --ink-2: #3c4b75;
  --ink-3: #6f7ca0;
  --hl: rgba(42, 120, 214, 0.22);
  --xml: #e2622c;
  --dsl: #2a78d6;
  --slm: #0f9f95;
  --xml-ink: #b5461a;
  --dsl-ink: #1c5cab;
  --slm-ink: #0b7a72;
  --good: #1f9a45;
  --bad: #d03b3b;
  --shadow: 0 18px 50px rgba(18, 38, 100, 0.13);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.nocursor, body.nocursor * { cursor: none !important; }

#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; user-select: none;
  background: radial-gradient(1200px 760px at 20% 4%, var(--bg-glow), transparent 72%), var(--bg);
}
#stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--grid) 1.3px, transparent 1.8px);
  background-size: 40px 40px; background-position: 20px 20px;
}

/* ── slides ─────────────────────────────────────────────────────────────── */
.slide {
  position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.34s ease, visibility 0s linear 0.34s;
}
.slide.active {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity 0.5s ease 0.1s, visibility 0s;
}
.hd { position: absolute; left: 110px; right: 110px; top: 104px; }
.h1 {
  font: 500 60px/1.08 var(--f-display); letter-spacing: -0.012em; margin: 0;
  max-width: 1600px; text-wrap: balance; font-optical-sizing: auto;
}
.body { position: absolute; left: 110px; top: 266px; width: 1700px; height: 714px; }
.fig { position: absolute; left: 0; top: 0; overflow: visible; }
.note {
  position: absolute; left: 110px; bottom: 36px; max-width: 1380px;
  font: 400 18px/1.4 var(--f-sans); color: var(--ink-3);
}

/* revelações ligadas a passos (data-at) */
.rv { opacity: 0; transition: opacity 0.6s ease var(--d, 0s); }
.rv.on { opacity: 1; }
.instant, .instant *, .instant *::before, .instant *::after { transition: none !important; animation: none !important; }

/* tipografia de dados */
.mono { font-family: var(--f-mono); }
.serif { font-family: var(--f-display); }
.num { font-family: var(--f-sans); font-weight: 800; letter-spacing: -0.03em; line-height: 0.95; }
.lbl { font: 500 24px/1.3 var(--f-sans); color: var(--ink-2); }
.sm { font: 400 20px/1.35 var(--f-sans); color: var(--ink-3); }
.tag {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px; border-radius: 7px;
  font: 600 16px/1 var(--f-mono); letter-spacing: 0.04em; color: var(--ink-2);
  border: 1px solid var(--line-2); background: var(--surface);
}
.sw { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; }
.c-xml { --c: var(--xml); } .c-dsl { --c: var(--dsl); } .c-slm { --c: var(--slm); }
.explo {
  position: absolute; right: 110px; top: 38px; height: 34px; padding: 0 14px; border-radius: 8px;
  display: flex; align-items: center; font: 500 18px/1 var(--f-sans); color: var(--ink);
  border: 1.5px dashed var(--line-2);
}
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ok { color: var(--good); } .ko { color: var(--bad); }

/* painéis e código */
.panel {
  position: absolute; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.panel-hd {
  height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  border-bottom: 1px solid var(--line); color: var(--ink-3); font: 500 17px/1 var(--f-sans);
}
.panel-hd b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.code {
  font-family: var(--f-mono); white-space: pre; font-variant-ligatures: none;
  padding: 18px 22px; color: var(--ink-2); tab-size: 2;
}
.code .ln { margin: 0 -22px; padding: 0 22px; transition: background 0.25s; }
.code .ln.hot { background: color-mix(in srgb, var(--dsl) 20%, transparent); box-shadow: inset 4px 0 0 var(--dsl); }
.code .ln.hid { opacity: 0; }
.tk { position: relative; }
.tk.hid { visibility: hidden; }
.tk.cur::after {
  content: ""; position: absolute; left: calc(100% + 3px); top: 0.12em; width: 0.52em; height: 1.05em;
  background: var(--ink-2); border-radius: 2px;
}
.tk.k-kw { color: var(--dsl-ink); font-weight: 600; }

  "xml": "<definitions xmlns=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" id=\"Definitions_1\" targetNamespace=\"http://www.omg.org/spec/BPMN/20100524/MODEL\">\n  <process id=\"Process_Order_Processing_with_Retry\" name=\"Order Processing with Retry\">\n    <startEvent id=\"StartEvent_1\" name=\"start\"/>\n    <serviceTask id=\"ServiceTask_1\" name=\"Fetch data\"/>\n    <sequenceFlow id=\"SequenceFlow_1\" sourceRef=\"StartEvent_1\" targetRef=\"ServiceTask_1\"/>\n    <serviceTask id=\"ServiceTask_2\" name=\"Validate\"/>\n    <sequenceFlow id=\"SequenceFlow_2\" sourceRef=\"ServiceTask_1\" targetRef=\"ServiceTask_2\"/>\n    <exclusiveGateway id=\"ExclusiveGateway_1\" name=\"Valid?\"/>\n    <serviceTask id=\"ServiceTask_3\" name=\"Process\"/>\n    <sequenceFlow id=\"SequenceFlow_3\" sourceRef=\"ExclusiveGateway_1\" targetRef=\"ServiceTask_3\">\n      <conditionExpression>yes</conditionExpression>\n    </sequenceFlow>\n    <endEvent id=\"EndEvent_1\" name=\"end\"/>\n    <sequenceFlow id=\"SequenceFlow_4\" sourceRef=\"ServiceTask_3\" targetRef=\"EndEvent_1\"/>\n    <exclusiveGateway id=\"ExclusiveGateway_2\" name=\"Retry?\"/>\n    <sequenceFlow id=\"SequenceFlow_5\" sourceRef=\"ExclusiveGateway_2\" targetRef=\"ServiceTask_1\">\n      <conditionExpression>yes</conditionExpression>\n    </sequenceFlow>\n    <endEvent id=\"EndEvent_2\" name=\"Invalid\">\n      <errorEventDefinition/>\n    </endEvent>\n    <sequenceFlow id=\"SequenceFlow_6\" sourceRef=\"ExclusiveGateway_2\" targetRef=\"EndEvent_2\">\n      <conditionExpression>no</conditionExpression>\n    </sequenceFlow>\n    <sequenceFlow id=\"SequenceFlow_7\" sourceRef=\"ExclusiveGateway_1\" targetRef=\"ExclusiveGateway_2\">\n      <conditionExpression>no</conditionExpression>\n    </sequenceFlow>\n    <sequenceFlow id=\"SequenceFlow_8\" sourceRef=\"ServiceTask_2\" targetRef=\"ExclusiveGateway_1\"/>\n  </process>\n</definitions>"

<script>
/* kit.js — utilidades de desenho e animação. Sem dependências.
   Toda animação é uma função pura do progresso p ∈ [0, 1]: o motor pode tocar,
   concluir ou desfazer qualquer passo sem estado escondido. */
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const K = (window.K = {});
  window.SLIDES = [];

  K.clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.seg = (p, a, b) => K.clamp((p - a) / (b - a));
  K.ease = {
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    back: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  };
  K.fmt = (n, d = 1) => n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  K.int = (n) => Math.round(n).toLocaleString('pt-BR');

  K.h = (html) => {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  K.s = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) k === 'text' ? (e.textContent = attrs[k]) : e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  K.text = (el, s) => { if (el.textContent !== s) el.textContent = s; };
  K.op = (el, v) => { el.style.opacity = v; };
  // Retângulo de `el` em coordenadas do palco, relativo a `box`.
  K.rectIn = (el, box) => {
    const s = window.DECK_SCALE || 1, a = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    return { x: (a.left - b.left) / s, y: (a.top - b.top) / s, w: a.width / s, h: a.height / s };
  };

  const ICONS = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    arrow: '<path d="M4 12h15M13 6l6 6-6 6"/>',
    back: '<path d="M20 12H5M11 6l-6 6 6 6"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
    doc: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
    scale: '<path d="M12 4v16M6 20h12M5 8h14M5 8l-2.5 6a3 3 0 005 0zM19 8l-2.5 6a3 3 0 005 0z"/>',
    ruler: '<path d="M3 16L16 3l5 5L8 21zM7 12l2 2M10 9l2 2M13 6l2 2"/>',
    stack: '<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/>',
    braces: '<path d="M9 4c-2 0-3 1-3 3v2c0 1.5-1 3-2.5 3C5 12 6 13.500 6 15v2c0 2 1 3 3 3M15 4c2 0 3 1 3 3v2c0 1.500 1 3 2.500 3-1.500 0-2.500 1.500-2.500 3v2c0 2-1 3-3 3"/>',
  };
  K.icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

  // Contorno de engrenagem centrado em (0, 0).
  K.gear = (R, r, n) => {
    const step = (Math.PI * 2) / n;
    let d = '';
    for (let i = 0; i < n; i++) {
      const a = i * step;
      [[r, a - step * 0.27], [R, a - step * 0.13], [R, a + step * 0.13], [r, a + step * 0.27]].forEach(([rad, ang], j) => {
        d += (i + j === 0 ? 'M' : 'L') + (Math.cos(ang) * rad).toFixed(2) + ',' + (Math.sin(ang) * rad).toFixed(2);
      });
    }
    return d + 'Z';
  };

  // Rota ortogonal com cantos arredondados.
  K.route = (pts, r = 14) => {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1);
      const rr = Math.min(r, d1 / 2, d2 / 2);
      d += ` L${x1 - ((x1 - x0) / d1) * rr},${y1 - ((y1 - y0) / d1) * rr} Q${x1},${y1} ${x1 + ((x2 - x1) / d2) * rr},${y1 + ((y2 - y1) / d2) * rr}`;
    }
    const z = pts[pts.length - 1];
    return d + ` L${z[0]},${z[1]}`;
  };

  // Traço que se desenha com o progresso.
  K.stroke = (path) => {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    const o = { path, len, set(p) { path.style.strokeDashoffset = len * (1 - K.clamp(p)); }, at: (t) => path.getPointAtLength(len * K.clamp(t)) };
    o.set(0);
    return o;
  };

  /* ── BPMN ────────────────────────────────────────────────────────────── */
  K.bpmn = (root, opt = {}) => {
    const fs = opt.fs || 22;
    const gF = K.s('g', {}, root), gN = K.s('g', {}, root), gT = K.s('g', {}, root);
    const api = { n: {}, f: {} };
    const node = (id, cx, cy, build) => {
      const g = K.s('g', { class: 'bp-node' }, gN);
      build(g);
      const o = {
        g, cx, cy,
        show(p) {
          p = K.clamp(p);
          g.setAttribute('transform', `translate(${cx},${cy}) scale(${0.55 + 0.45 * K.ease.back(p)})`);
          g.style.opacity = K.clamp(p * 2.4);
        },
        hit(on) { g.classList.toggle('hit', !!on); },
      };
      o.show(1);
      return (api.n[id] = o);
    };
    api.task = (id, cx, cy, label, o = {}) => node(id, cx, cy, (g) => {
      const w = o.w || 170, h = o.h || 80, f = o.fs || fs, lines = String(label).split('\n');
      K.s('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 13, class: 'bp-shape' }, g);
      lines.forEach((ln, i) => K.s('text', { x: 0, y: (i - (lines.length - 1) / 2) * f * 1.2, class: 'bp-label', 'font-size': f, text: ln }, g));
    });
    api.event = (id, cx, cy, kind, label, o = {}) => node(id, cx, cy, (g) => {
      const r = o.r || 21;
      K.s('circle', { r, class: 'bp-shape' + (kind === 'start' ? '' : ' bp-end') }, g);
      if (kind === 'error') K.s('path', { d: 'M-8,7 L-3,-8 L2,2 L8,-7 L3,8 L-2,-2 Z', class: 'bp-glyph' }, g);
      if (label) K.s('text', { x: 0, y: r + 28, class: 'bp-cap', text: label }, g);
    });
    api.gateway = (id, cx, cy, label, o = {}) => node(id, cx, cy, (g) => {
      const r = o.r || 38, k = r * 0.3;
      K.s('path', { d: `M0,${-r} L${r},0 L0,${r} L${-r},0 Z`, class: 'bp-shape' }, g);
      K.s('path', { d: `M${-k},${-k} L${k},${k} M${k},${-k} L${-k},${k}`, class: 'bp-x' }, g);
      if (label) K.s('text', { x: o.lx || 0, y: o.ly != null ? o.ly : -r - 14, class: 'bp-cap', 'text-anchor': o.anchor || 'middle', text: label }, g);
    });
    api.flow = (id, pts, o = {}) => {
      const g = K.s('g', { class: 'bp-flow' }, gF);
      const path = K.s('path', { d: typeof pts === 'string' ? pts : K.route(pts, o.r || 14), class: 'bp-edge' }, g);
      const head = K.s('path', { d: 'M1,0 L-13,-6.500 L-13,6.500 Z', class: 'bp-head' }, g);
      const lab = o.label ? K.s('text', { x: o.lx, y: o.ly, class: 'bp-cond', text: o.label }, g) : null;
      const len = path.getTotalLength();
      const a = path.getPointAtLength(len), b = path.getPointAtLength(Math.max(0, len - 3));
      head.setAttribute('transform', `translate(${a.x},${a.y}) rotate(${(Math.atan2(a.y - b.y, a.x - b.x) * 180) / Math.PI})`);
      path.style.strokeDasharray = `${len} ${len}`;
      const f = {
        g, path, len, lab,
        show(p) {
          p = K.clamp(p);
          path.style.strokeDashoffset = len * (1 - K.ease.io(p));
          head.style.opacity = K.seg(p, 0.82, 1);
          g.style.opacity = p > 0 ? 1 : 0;
          if (lab) lab.style.opacity = K.seg(p, 0.3, 0.75);
        },
        at: (t) => path.getPointAtLength(len * K.clamp(t)),
      };
      f.show(1);
      return (api.f[id] = f);
    };
    api.token = (cls = '') => {
      const c = K.s('circle', { r: 11, class: 'bp-token ' + cls }, gT);
      c.style.opacity = 0;
      return { el: c, to(pt, op = 1) { c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.style.opacity = op; }, hide() { c.style.opacity = 0; } };
    };
    return api;
  };

  // Processo do Código 1 da monografia ("Order Processing with Retry"), em 980 × 560.
  K.orderDiagram = (g) => {
    const b = K.bpmn(g);
    b.flow('f1', [[70, 170], [113, 170]]);
    b.flow('f2', [[285, 170], [323, 170]]);
    b.flow('f3', [[495, 170], [549, 170]]);
    b.flow('yes', [[630, 170], [683, 170]], { label: 'yes', lx: 654, ly: 152 });
    b.flow('f5', [[835, 170], [879, 170]]);
    b.flow('no', [[590, 210], [590, 389]], { label: 'no', lx: 612, ly: 300 });
    b.flow('loop', [[550, 430], [200, 430], [200, 212]], { label: 'yes', lx: 516, ly: 412, r: 22 });
    b.flow('err', [[630, 430], [734, 430]], { label: 'no', lx: 672, ly: 412 });
    b.event('start', 50, 170, 'start');
    b.task('fetch', 200, 170, 'Fetch data');
    b.task('validate', 410, 170, 'Validate');
    b.gateway('valid', 590, 170, 'Valid?');
    b.task('process', 760, 170, 'Process', { w: 150 });
    b.event('end', 905, 170, 'end');
    b.gateway('retry', 590, 430, 'Retry?', { ly: 70 });
    b.event('invalid', 760, 430, 'error', 'Invalid');
    return b;
  };

  /* ── código com realce ───────────────────────────────────────────────── */
  const DSL_KW = /^(@lane|process|pool|collaboration|start|end|catch|throw|task|user|service|manual|script|send|receive|rule|xor|and|or|event|subprocess|call|note|message|from|to)\b(:[a-z]+)?/;
  K.lexDSL = (line) => {
    const out = [];
    let i = 0, m;
    while (i < line.length) {
      const r = line.slice(i);
      if ((m = /^\s+/.exec(r))) out.push(['ws', m[0]]);
      else if ((m = /^#"[^"]*"/.exec(r)) || (m = /^#[A-Za-z_]\w*/.exec(r))) out.push(['ref', m[0]]);
      else if ((m = /^"[^"]*"/.exec(r))) out.push(['str', m[0]]);
      else if ((m = /^->/.exec(r))) out.push(['op', m[0]]);
      else if ((m = /^\[[^\]]*\]/.exec(r))) out.push(['cond', m[0]]);
      else if ((m = DSL_KW.exec(r))) out.push(['kw', m[0]]);
      else if ((m = /^[{}();,]/.exec(r))) out.push(['pun', m[0]]);
      else { m = /^\S+/.exec(r); out.push(['id', m[0]]); }
      i += m[0].length;
    }
    return out;
  };
  // "info": o que descreve o processo (tipos de nó, rótulos, condições).
  const NODE_TAG = /^(startEvent|endEvent|serviceTask|userTask|task|exclusiveGateway|parallelGateway|errorEventDefinition)$/;
  K.lexXML = (line) => {
    const out = [];
    let i = 0, m, attr = '';
    while (i < line.length) {
      const r = line.slice(i);
      if ((m = /^\s+/.exec(r))) out.push(['ws', m[0]]);
      else if ((m = /^<(\/?)([\w:]+)/.exec(r))) {
        out.push(['pun', '<' + m[1]]);
        out.push([!m[1] && NODE_TAG.test(m[2]) ? 'tag info' : 'tag', m[2]]);
      } else if ((m = /^\/?>/.exec(r))) out.push(['pun', m[0]]);
      else if ((m = /^([\w:]+)=/.exec(r))) { attr = m[1]; out.push(['attr', m[0]]); }
      else if ((m = /^"[^"]*"/.exec(r))) out.push([attr === 'name' ? 'val info' : 'val', m[0]]);
      else { m = /^[^<\s]+/.exec(r); out.push([m[0] === '…' ? 'pun' : 'txt info', m[0]]); }
      i += m[0].length;
    }
    return out;
  };
  K.code = (host, text, lang) => {
    host.classList.add('code');
    const lex = lang === 'xml' ? K.lexXML : K.lexDSL, lines = [], toks = [];
    text.split('\n').forEach((ln, li) => {
      const row = K.h('<div class="ln"></div>');
      lex(ln).forEach(([cls, s]) => {
        if (cls === 'ws') return void row.appendChild(document.createTextNode(s));
        const sp = document.createElement('span');
        sp.className = 'tk ' + cls.replace(/^(\w+)/, 'k-$1');
        sp.textContent = s;
        sp._line = li;
        row.appendChild(sp);
        toks.push(sp);
      });
      if (!row.childNodes.length) row.textContent = ' ';
      host.appendChild(row);
      lines.push(row);
    });
    return {
      host, lines, toks,
      show(n) {
        const k = Math.floor(n + 1e-6);
        for (let i = 0; i < toks.length; i++) {
          toks[i].classList.toggle('hid', i >= k);
          toks[i].classList.toggle('cur', i === k - 1 && k < toks.length && k > 0);
        }
      },
      showLines(n) { lines.forEach((l, i) => l.classList.toggle('hid', i >= n)); },
      mark(li) { lines.forEach((l, i) => l.classList.toggle('hot', i === li)); },
      find(str, nth = 0) { return toks.filter((t) => t.textContent === str)[nth]; },
    };
  };

  /* ── minimapa do exemplo: 30 linhas de XML que se fundem nas 12 da DSL ── */
  K.XML2DSL = [0, 0, 1, 2, 2, 3, 3, 4, 5, 5, 5, 5, 5, 5, 6, 7, 7, 7, 8, 8, 8, 8, 8, 8, 6, 6, 6, 4, 11, 11];
  K.minimap = (svg, o = {}) => {
    const E = window.DADOS.exemplo, cw = o.cw || 3.4, bh = o.h || 6, lp = o.pitch || 13, cap = o.cap || 100;
    const info = (l) => { const ind = l.length - l.trimStart().length; return { ind, len: Math.min(l.length, cap) - ind }; };
    const X = E.xml.split('\n').map(info), L = E.dsl.split('\n').map(info);
    const g = K.s('g', { class: 'mini' }, svg), yD = (j) => ((X.length - L.length) / 2 + j) * lp;
    const bars = X.map((a, i) => ({ el: K.s('rect', { height: bh, rx: bh / 2 }, g), a, d: L[K.XML2DSL[i]], yx: i * lp, yd: yD(K.XML2DSL[i]), i }));
    const lone = L.map((d, j) => (K.XML2DSL.includes(j) ? null : { el: K.s('rect', { height: bh, rx: bh / 2, x: d.ind * cw, y: yD(j), width: d.len * cw }, g) })).filter(Boolean);
    return {
      g, height: X.length * lp,
      // e: 0 = XML, 1 = DSL
      set(e) {
        g.style.setProperty('--mix', (1 - K.clamp(e)) * 100 + '%');
        for (const b of bars) {
          const t = K.ease.io(K.seg(e, (b.i / X.length) * 0.35, (b.i / X.length) * 0.35 + 0.65));
          b.el.setAttribute('x', K.lerp(b.a.ind, b.d.ind, t) * cw);
          b.el.setAttribute('y', K.lerp(b.yx, b.yd, t));
          b.el.setAttribute('width', K.lerp(b.a.len, b.d.len, t) * cw);
        }
        for (const b of lone) b.el.style.opacity = K.seg(e, 0.7, 1);
      },
    };
  };

  /* ── tira de 138 gerações: 46 itens (colunas) × 3 repetições (linhas) ── */
  const WHY = { v: 'válida no XSD', u: 'referência não declarada', m: 'referência fora de posição', s: 'outra falha de sintaxe', o: 'bloco não fechado', t: 'truncada no limite de tokens', x: 'XML recusado pelo XSD' };
  K.strip = (svg, arm, o = {}) => {
    const D = window.DADOS, codes = o.codes || D.bracos[arm];
    const R = o.r || 9, pitch = o.pitch || 26, x0 = (o.x || 0) + pitch / 2, y0 = (o.y || 0) + pitch / 2;
    const g = K.s('g', { class: 'strip ' + (o.cls || '') }, svg), dots = [];
    for (let i = 0; i < codes.length; i++) {
      const col = Math.floor(i / 3), row = i % 3;
      const el = K.s('circle', { cx: x0 + col * pitch, cy: y0 + row * pitch, r: 2.4, class: 'sd' }, g);
      dots.push({ el, col, row, i, x: x0 + col * pitch, y: y0 + row * pitch });
    }
    const tip = (d, cs, name) => {
      const note = D.notas[name] && D.notas[name][d.i] ? ' ' + D.notas[name][d.i] : '';
      d.el.setAttribute('data-tip', `${D.itens[d.col]}, repetição ${d.row + 1}: ${WHY[cs[d.i]]}${note}`);
    };
    const paint = (d, code, t) => {
      const el = d.el;
      if (t <= 0) { el.setAttribute('r', 2.4); el.setAttribute('class', 'sd'); return; }
      if (code === 'v') { el.setAttribute('class', 'sd v'); el.setAttribute('r', K.lerp(2.4, R, K.ease.back(t))); }
      else { el.setAttribute('class', 'sd x'); el.setAttribute('r', K.lerp(2.4, R * 0.74, K.ease.out(t))); }
    };
    const delay = (d) => ((d.col + d.row * 0.4) / 47) * 0.8;
    if (!o.plain) dots.forEach((d) => tip(d, codes, arm));
    return {
      g, dots, codes, R, pitch,
      fill(p) { for (const d of dots) paint(d, codes[d.i], K.seg(p, delay(d), delay(d) + 0.16)); },
      // Passa do desfecho de `from` para o de `codes`, ponto a ponto.
      morph(p, from) {
        for (const d of dots) {
          const a = from[d.i] === 'v', b = codes[d.i] === 'v', t = K.seg(p, delay(d), delay(d) + 0.18);
          if (a === b) paint(d, codes[d.i], 1);
          else if (t < 0.5) paint(d, from[d.i], 1 - t * 2 + 0.001);
          else paint(d, codes[d.i], (t - 0.5) * 2);
        }
      },
      count(cs = codes) { return [...cs].filter((c) => c === 'v').length; },
    };
  };
})();
</script>
<script>
/* slides-a.js — capa e problema (slides 1 a 5). */
(function () {
  'use strict';
  const K = window.K, S = window.SLIDES, D = window.DADOS;

  K.steps = (durs, render) => {
    const P = durs.map(() => 0);
    return durs.map((dur, j) => ({ dur, draw(p) { P[j] = p; render(P); } }));
  };

  /* ── 1. Capa ─────────────────────────────────────────────────────────── */
  const PAIRS = [
    { pre: '<serviceTask id="ServiceTask_2" name=', kw: 'service ', mid: '"Validate"', post: '/>' },
    { pre: '<sequenceFlow id="SequenceFlow_2" sourceRef="ServiceTask_1" targetRef="ServiceTask_2"/>', kw: '->', mid: '', post: '' },
    { pre: '<exclusiveGateway id="ExclusiveGateway_1" name=', kw: 'xor ', mid: '"Valid?"', post: '/>' },
    { pre: '<endEvent id="EndEvent_2" name=', kw: 'end:error ', mid: '"Invalid"', post: '><errorEventDefinition/></endEvent>' },
  ];
  K.morph = (c, t, still) => {
    const T = 6.8, i = Math.floor(t / T) % PAIRS.length, u = still ? 4.6 : t % T, P = PAIRS[i];

      // percurso do token do processo: [elemento, linha da DSL]
      const run = [['start', 1], ['f1', 2], ['fetch', 2], ['f2', 3], ['validate', 3], ['f3', 4], ['valid', 4], ['no', 6], ['retry', 6], ['loop', 7], ['fetch', 2], ['f2', 3], ['validate', 3], ['f3', 4], ['valid', 4], ['yes', 5], ['process', 5], ['f5', 5], ['end', 5]];
      const segs = run.map(([id, ln]) => (b.f[id] ? { f: b.f[id], ln, len: b.f[id].len } : { n: b.n[id], ln, len: 95 }));
      const total = segs.reduce((a, s) => a + s.len, 0);
      const clear = () => { tok.hide(); code.mark(-1); Object.values(b.n).forEach((n) => n.hit(false)); };
      return [
        {
          dur: 7600,
          draw(p) {
            const n = K.seg(p, 0.03, 0.9) * code.toks.length;
            code.show(p >= 1 ? code.toks.length : n);
            for (const id in when) (b.n[id] || b.f[id]).show(K.seg(n, when[id] + 0.3, when[id] + 1.8));
            chips.style.opacity = K.seg(p, 0.92, 1);
          },
        },
        {
          dur: 8200,
          draw(p) {
            clear();
            if (p <= 0 || p >= 1) return;
            let L = p * total;
            for (const s of segs) {
              if (L <= s.len) {
                code.mark(s.ln);
                if (s.f) tok.to(s.f.at(L / s.len));
                else s.n.hit(true);
                return;
              }
              L -= s.len;
            }
          },
        },
      ];
    },
  });

  /* ── 8. O transpilador ───────────────────────────────────────────────── */
  const MAP = [[0, 1], [2], [3, 4], [5, 6], [7, 27], [8, 9, 10, 11, 12, 13], [14, 24, 25, 26], [15, 16, 17], [18, 19, 20, 21, 22, 23], [], [], [28, 29]];
  S.push({

          </defs>
          <rect width="560" height="131.250" fill="url(#pd0)"/><rect y="131.250" width="533.750" height="8.750" fill="url(#pd0)"/>
          <g clip-path="url(#pc)"><rect width="560" height="131.250" fill="url(#pd1)"/><rect y="131.250" width="533.750" height="8.750" fill="url(#pd1)"/></g>
        </svg>

    setup(c) {
      const dsl = K.code(c.$('.dsl'), D.exemplo.dsl, 'dsl');

            dsl.mark(p > 0 && p < 1 ? Math.min(i, MAP.length - 1) : -1);
            let chars = 0;
            MAP.forEach((ls, j) => ls.forEach((x) => {

            stamp.style.opacity = K.seg(p, 0.78, 0.9);

        {

          draw(p) {

  /* ── 9. Compressão ───────────────────────────────────────────────────── */
  S.push({
    id: 'compressao', act: 'Proposta', name: 'Compressão medida',
    title: 'A DSL deixa de emitir 81% dos tokens do XML equivalente.',

    html: `<div class="body cmp">
      <svg class="fig" viewBox="0 0 540 540" width="540" height="540" style="top:14px"></svg>

  /* ── 10. Corpus e destilação ─────────────────────────────────────────── */
  const LOSS = [1.1498, 0.7415, 0.5599, 0.5188, 0.5187, 0.5057, 0.4673, 0.473, 0.4392, 0.4005, 0.4, 0.3898, 0.4105, 0.3922, 0.3903, 0.4021, 0.3783, 0.3539, 0.3261, 0.3034, 0.335, 0.328, 0.3162, 0.3128, 0.3347];
  S.push({
    id: 'destilacao', act: 'Proposta', name: 'Corpus e ajuste do modelo pequeno',

    setup(c) {

      cap(gT, 115, Y + 158, '772 descrições', '728 da GitLab, 44 do PET');

      // pares
      const gP = G();
      [[16, -12], [8, -6], [0, 0]].forEach(([dx, dy]) => {
        K.s('rect', { x: 934 + dx, y: Y - 58 + dy, width: 196, height: 116, rx: 8, class: 'card' }, gP);
      });
      [70, 62, 68, 50, 66].forEach((w, i) => K.s('rect', { x: 950, y: Y - 36 + i * 18, width: w, height: 5, rx: 2.5, class: 'tline' }, gP));
      K.s('path', { d: `M1032,${Y - 44} V${Y + 44}`, class: 'split' }, gP);
      bars(gP, D.exemplo.dsl.split('\n').slice(1, 9).join('\n'), 1040, Y - 38, 1.9, 10.5, 'b-dsl');
      cap(gP, 1032, Y + 158, 'pares de treino', 'texto original e DSL');
      // aluno
      const gS = G();
      K.s('circle', { cx: 1366, cy: Y, r: 72, class: 'stu-bg' }, gS);
      const ring = K.s('circle', { cx: 1366, cy: Y, r: 72, class: 'stu-ring', transform: `rotate(-90 1366 ${Y})` }, gS);
      K.s('text', { x: 1366, y: Y, class: 'big-l', text: '7B' }, gS);
      cap(gS, 1366, Y + 158, 'Qwen2.5-Coder 7B', 'ajuste com QLoRA, 4 bits');
      const circ = 2 * Math.PI * 72;
      ring.style.strokeDasharray = circ;
      // perda de treino (dados reais do ajuste)
      const gLo = G(), lx = (i) => 1478 + (i / (LOSS.length - 1)) * 190, ly = (v) => Y + 44 - ((v - 0.3) / 0.85) * 96;
      const loss = K.stroke(K.s('path', { d: LOSS.map((v, i) => (i ? 'L' : 'M') + lx(i).toFixed(1) + ',' + ly(v).toFixed(1)).join(' '), class: 'loss' }, gLo));
      K.s('path', { d: `M1478,${Y + 50} H1668`, class: 'ax' }, gLo);

      const P0 = mk('p-doc', 7), P1 = mk('p-doc', 7), P2 = mk('p-pair', 7), P3 = mk('p-pair', 7);
      const fly = (ps, f, p, a, z) => ps.forEach((el, i) => {
        const u = K.seg(p, a + (i / ps.length) * (z - a) * 0.7, a + (i / ps.length) * (z - a) * 0.7 + (z - a) * 0.3), pt = f.at(u);
        el.setAttribute('x', pt.x - 8);
        el.setAttribute('y', pt.y - 5.5);
        el.style.opacity = u > 0 && u < 1 ? 1 : 0;

      c.gear = gear; c.Y = Y;
      return [{
        dur: 7800,
        draw(p) {
          show(gT, K.seg(p, 0, 0.08));
          F[0].show(K.seg(p, 0.06, 0.12));
          show(gA, K.seg(p, 0.08, 0.17));
          fly(P0, F[0], p, 0.12, 0.34);
          F[1].show(K.seg(p, 0.26, 0.32));
          show(gC, K.seg(p, 0.28, 0.36));
          fly(P1, F[1], p, 0.3, 0.52);
          F[2].show(K.seg(p, 0.36, 0.42));
          show(gP, K.seg(p, 0.4, 0.48));
          fly(P2, F[2], p, 0.38, 0.6);
          K.text(nPairs, K.int(768 * K.ease.out(K.seg(p, 0.42, 0.64))));
          show(stats[0], K.seg(p, 0.42, 0.5));
          F[3].show(K.seg(p, 0.58, 0.64));
          show(gS, K.seg(p, 0.6, 0.68));
          fly(P3, F[3], p, 0.62, 0.86);
          const tr = K.seg(p, 0.66, 0.9);
          ring.style.strokeDashoffset = circ * (1 - tr);
          show(gLo, K.seg(p, 0.64, 0.7), 0);
          loss.set(tr);
          show(stats[1], K.seg(p, 0.86, 0.93));
          show(stats[2], K.seg(p, 0.91, 0.98));
        },
      }];
    },
    loop: (t, c) => c.gear.setAttribute('transform', `translate(764,${c.Y}) rotate(${(t * 36) % 360})`),
  });
})();

<script>
/* slides-c.js — experimento e validade (slides 11 a 16). */
(function () {
  'use strict';
  const K = window.K, S = window.SLIDES, D = window.DADOS;
  const pct = (codes) => ([...codes].filter((x) => x === 'v').length / codes.length) * 100;
  const show = (el, p, dy = 6) => {
    el.style.opacity = K.clamp(p);
    el.style.transform = `translateY(${(1 - K.ease.out(K.clamp(p))) * dy}px)`;
  };

  // Linha de resultado: rótulo, tira das 138 gerações e validade.
  K.row = (host, o) => {
    const el = K.h(`<div class="srow" style="top:${o.y}px">
      <div class="srow-l"><b>${o.title}</b><span class="tag">${o.tag}</span></div>
      <svg viewBox="0 0 1196 78" width="1196" height="78" class="c-${o.c}"></svg>
      <div class="srow-v"><b>0,0</b><i>%</i></div>
      ${o.under ? `<div class="srow-u">${o.under}</div>` : ''}</div>`);
    host.appendChild(el);
    const strip = K.strip(el.querySelector('svg'), o.arm), val = el.querySelector('.srow-v b'), to = pct(strip.codes);
    return {
      el, strip, to,
      // p: 0 → 1. Com `from` (desfechos de outro braço), a tira muda ponto a ponto.
      set(p, from) {
        el.style.opacity = K.seg(p, 0, 0.08);
        if (from) {
          strip.morph(K.seg(p, 0.12, 1), from);
          K.text(val, K.fmt(K.lerp(pct(from), to, K.ease.io(K.seg(p, 0.12, 0.96)))));
        } else {
          strip.fill(K.seg(p, 0.05, 1));
          K.text(val, K.fmt(to * K.ease.out(K.seg(p, 0.05, 0.96))));
        }
      },
    };
  };

  /* ── 11. Desenho do experimento ──────────────────────────────────────── */
  const arm = (a, txt, cls = '') => `<div class="arm ${cls}" data-a="${a}"><b>${a}</b><span>${txt}</span></div>`;
  S.push({
    id: 'experimento', act: 'Experimento', name: 'Desenho do experimento',
    title: 'Mesmos textos, mesma medida. Muda uma coisa de cada vez.',
    note: 'Validade: proporção das gerações que produzem XML aceito pelo esquema XSD oficial do BPMN 2.0, verificada por programa.',
    html: `<div class="body xp">
      <div class="xp-top">
        <svg viewBox="0 0 1196 78" width="598" height="39" class="c-ink"></svg>
        <p><b>46</b> processos do conjunto de teste <i>×</i> <b>3</b> repetições <i>=</i> <b>138</b> gerações por braço</p>
      </div>
      <div class="xp-grid">
        <div></div>
        <div class="xh c-xml"><span class="sw"></span>escreve XML</div>
        <div class="xh c-dsl"><span class="sw"></span>escreve DSL, que o transpilador expande</div>
        <div class="xm"><b>DeepSeek V4 Pro</b><span>modelo de grande porte</span></div>
        <div class="xc">${arm('A1', 'geração direta, a prática corrente')}</div>
        <div class="xc">${arm('A2', 'gramática da DSL no prompt')}</div>
        <div class="xm"><b>GLM 5.2</b><span>grande porte, gerou o corpus</span></div>
        <div class="xc">${arm('A1g', 'geração direta')}</div>
        <div class="xc">${arm('A2g', 'gramática da DSL no prompt')}</div>
        <div class="xm"><b>Qwen2.5-Coder 7B</b><span>modelo pequeno</span></div>
        <div class="xc"></div>
        <div class="xc">${arm('A3', 'gramática no prompt, sem ajuste')}${arm('A3m', 'prompt mínimo, sem ajuste')}${arm('A4', 'prompt mínimo, com ajuste fino', 'slm')}</div>
      </div>
      <div class="enc e1"><span>mesmo modelo:<br>muda só o formato</span></div>
      <div class="enc e2"><span>mesmo modelo e mesmo prompt: muda só o adaptador</span></div>
    </div>`,
    setup(c) {
      const strip = K.strip(c.$('.xp-top svg'), 'A1', { codes: 'v'.repeat(138), plain: true });
      const cells = c.$$('.xp-grid > *'), body = c.$('.body'), e1 = c.$('.e1'), e2 = c.$('.e2'), top = c.$('.xp-top p');
      const T = (a) => c.$(`.arm[data-a="${a}"]`);

      const place = (enc, a, b) => {
        const r1 = K.rectIn(T(a), body), r2 = K.rectIn(T(b), body), pad = 10;
        enc.style.left = r1.x - pad + 'px';
        enc.style.top = r1.y - pad + 'px';

      return K.steps([3200, 700, 700], ([a, b, d]) => {
        if (!done) { place(e1, 'A1', 'A2'); place(e2, 'A3m', 'A4'); done = true; }

        cells.forEach((el, i) => show(el, K.seg(a, 0.34 + Math.floor(i / 3) * 0.12, 0.52 + Math.floor(i / 3) * 0.12)));
        e1.style.opacity = K.ease.out(b);
        e2.style.opacity = K.ease.out(d);
      });
    },
  });

  /* ── 12. A DSL reduziu a validade ────────────────────────────────────── */
  S.push({
    id: 'validade', act: 'Resultados', name: 'A DSL reduziu a validade',
    title: 'Com o mesmo modelo, pedir DSL no lugar de XML reduziu a validade.',
    note: 'Cada ponto é uma geração: coluna = processo, linha = repetição. Cheio = XML aceito pelo XSD oficial. Vazado = saída inválida.',
    html: `<div class="body rows">
      <div class="gh" style="top:6px">DeepSeek V4 Pro</div>
      <div class="gh g2" style="top:336px">GLM 5.2 <span>o modelo que gerou o corpus</span></div>
    </div>`,
    setup(c) {
      const host = c.$('.rows'), g2 = c.$('.g2');
      const r = [

    <div class="cover-by rv" data-at="0" style="--d:.5s"><b>Rafael Marins Florenzano</b><span>Compressão Semântica na Geração de Modelos BPMN 2.0 por Modelos de Linguagem</span></div>`,
    setup: K.morphSetup,
    loop: (t, c, s) => K.morph(c, t, s.still),
  });
})();
</script>
<script>
/* engine.js — palco, navegação e passos.
   Cada slide tem passos; cada passo é { dur, draw(p, ctx) } com p ∈ [0, 1].
   O passo 0 toca ao entrar. Avançar conclui o passo atual e toca o seguinte;
   voltar desfaz. Elementos com data-at="k" recebem .on do passo k em diante. */
(function () {
  'use strict';
  const K = window.K, defs = window.SLIDES;
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has('print');
  const INSTANT = PRINT || Q.has('instant');
  // Depuração: ?instant&at=0.4 desenha o passo do hash em 40%; ?time=3 congela os laços.
  const AT = Q.has('at') ? +Q.get('at') : 1;
  const TIME = Q.has('time') ? +Q.get('time') : null;
  if (INSTANT) document.documentElement.classList.add('instant');
  const stage = document.getElementById('stage');
  const $ = (id) => document.getElementById(id);
  const st = { i: -1, k: 0, anim: null, typed: '' };
  const acts = [];

  /* tema */
  /* Cada arquivo abre no próprio tema (apresentacao-clara.html já vem com data-theme="light").
     ?theme= na URL sobrepõe. O tema não fica salvo no navegador: arquivos locais dividem o
     mesmo armazenamento, e testar T num arquivo faria o outro abrir no tema errado. */
  const theme = Q.get('theme');
  if (theme === 'light') document.documentElement.dataset.theme = 'light';
  if (theme === 'dark') delete document.documentElement.dataset.theme;

  function fit() {
    if (PRINT) { window.DECK_SCALE = 1; return; }
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    window.DECK_SCALE = s;
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  }

  function build() {
    const first = stage.firstChild;
    defs.forEach((d, i) => {
      const el = document.createElement('section');
      el.className = 'slide s-' + d.id;
      el.innerHTML =
        (d.bare ? '' : `<header class="hd"><h1 class="h1">${d.title}</h1></header>${d.badge ? `<div class="explo">${d.badge}</div>` : ''}`) +
        (d.html || '') + (d.note ? `<footer class="note">${d.note}</footer>` : '') +
        `<div class="pn">${String(i + 1).padStart(2, '0')} / ${defs.length}</div>`;
      stage.insertBefore(el, first);
      d.el = el;
      d.ctx = { el, $: (q) => el.querySelector(q), $$: (q) => [...el.querySelectorAll(q)] };
      d.steps = [];
    });
    defs.forEach((d) => {
      const r = d.setup ? d.setup(d.ctx) : null;
      if (Array.isArray(r)) d.steps = r;
      let n = d.steps.length;
      d.el.querySelectorAll('[data-at]').forEach((e) => { n = Math.max(n, +e.dataset.at + 1); });
      d.n = Math.max(1, n);
    });
  }

  const draw = (d, j, p) => { const s = d.steps[j]; if (s && s.draw) s.draw(p, d.ctx); };
  function reveal(d, k) {
    d.el.querySelectorAll('[data-at]').forEach((e) => e.classList.toggle('on', +e.dataset.at <= k));
    d.el.dataset.step = k;
  }
  function apply(d, k, p) {
    for (let j = d.n - 1; j > k; j--) draw(d, j, 0);
    for (let j = 0; j < k; j++) draw(d, j, 1);
    draw(d, k, p);
    reveal(d, k);
  }
  function quiet(d, fn) {
    d.el.classList.add('instant');
    fn();
    void d.el.offsetWidth;
    if (!PRINT) d.el.classList.remove('instant');
  }
  function stop() {
    if (st.anim) { draw(st.anim.d, st.anim.k, 1); st.anim = null; }
  }
  function play() {
    const d = defs[st.i], s = d.steps[st.k];
    if (!s || !s.draw) return;
    if (!s.dur || INSTANT) return void s.draw(1, d.ctx);
    st.anim = { d, k: st.k, t0: performance.now(), dur: s.dur };
  }
  // mode: 'fwd' entra animando do passo 0; 'back' entra no estado final; 'jump' vai a um passo.
  function enter(i, k, mode) {
    i = K.clamp(i, 0, defs.length - 1);
    stop();
    const d = defs[i], old = defs[st.i];
    if (old && old !== d) old.el.classList.remove('active');
    st.i = i;
    if (mode === 'fwd') {
      st.k = 0;
      quiet(d, () => { apply(d, 0, 0); d.el.querySelectorAll('[data-at]').forEach((e) => e.classList.remove('on')); });
      d.el.classList.add('active');
      reveal(d, 0);
      play();
    } else {
      st.k = mode === 'back' ? d.n - 1 : K.clamp(k || 0, 0, d.n - 1);
      quiet(d, () => apply(d, st.k, 1));
      d.el.classList.add('active');
    }
    sync();
  }
  function next() {
    const d = defs[st.i];
    stop();
    if (st.k < d.n - 1) { st.k++; reveal(d, st.k); play(); sync(); }
    else if (st.i < defs.length - 1) enter(st.i + 1, 0, 'fwd');
  }
  function prev() {
    const d = defs[st.i];
    stop();
    if (st.k > 0) { st.k--; apply(d, st.k, 1); sync(); }
    else if (st.i > 0) enter(st.i - 1, 0, 'back');
  }
  function sync() {
    const d = defs[st.i];
    acts.forEach((a) => {
      a.el.classList.toggle('cur', a.name === d.act);
      const done = st.i > a.to ? 1 : st.i < a.from ? 0 : (st.i - a.from + (st.k + 1) / d.n) / (a.to - a.from + 1);
      a.fill.style.width = done * 100 + '%';
    });
    $('rail').style.opacity = d.bare ? 0 : 1;
    $('pgn').textContent = String(st.i + 1).padStart(2, '0') + ' / ' + defs.length;
    $('pgd').innerHTML = d.n > 1 ? Array.from({ length: d.n }, (_, j) => `<i class="${j <= st.k ? 'done' : ''}"></i>`).join('') : '';
    $('pg').style.opacity = d.bare ? 0 : 1;
    if (!PRINT) history.replaceState(null, '', '#' + (st.i + 1) + (st.k ? '.' + st.k : ''));
    document.querySelectorAll('#idx button').forEach((b, j) => b.classList.toggle('cur', j === st.i));
  }
  function frame(now) {
    const d = defs[st.i];
    if (st.anim) {
      const a = st.anim, p = Math.min(1, (now - a.t0) / a.dur);
      draw(a.d, a.k, p);
      if (p >= 1) st.anim = null;
    }
    if (d && d.loop) d.loop(TIME == null ? now / 1000 : TIME, d.ctx, { k: st.k, busy: !!st.anim, last: st.k === d.n - 1 });
    requestAnimationFrame(frame);
  }

  /* moldura */
  function chrome() {
    stage.insertAdjacentHTML('beforeend', `
      <nav id="rail"></nav>
      <div id="pg"><span class="dots" id="pgd"></span><span id="pgn"></span></div>
      <div id="tip"></div><div id="toast"></div><div id="black"></div>
      <div class="over" id="idx"><h2>Índice · clique para ir · G fecha</h2><div class="grid"></div></div>
      <div class="over" id="help"><h2>Atalhos</h2><dl>
        <dt>→ espaço PageDown clique</dt><dd>avança um passo</dd>
        <dt>← PageUp</dt><dd>volta um passo</dd>
        <dt>↓ ↑</dt><dd>próximo slide, slide anterior</dd>
        <dt>número + Enter</dt><dd>vai para o slide</dd>
        <dt>G</dt><dd>índice dos slides</dd>
        <dt>R</dt><dd>repete a animação do slide</dd>
        <dt>F</dt><dd>tela cheia</dd>
        <dt>T</dt><dd>tema claro ou escuro</dd>
        <dt>B</dt><dd>tela preta</dd>
        <dt>?</dt><dd>esta ajuda</dd></dl></div>`);
    const rail = $('rail');
    defs.forEach((d, i) => {
      if (!d.act) return;
      let a = acts[acts.length - 1];
      if (!a || a.name !== d.act) {
        const el = K.h(`<span>${d.act}<i><b></b></i></span>`);
        rail.appendChild(el);
        acts.push((a = { name: d.act, from: i, to: i, el, fill: el.querySelector('b') }));
      }
      a.to = i;
    });
    const grid = stage.querySelector('#idx .grid');
    defs.forEach((d, i) => {
      const b = K.h(`<button><small>${String(i + 1).padStart(2, '0')}${d.act ? ' · ' + d.act : ''}</small><span>${d.name || d.title.replace(/<[^>]+>/g, '')}</span></button>`);
      b.addEventListener('click', (e) => { e.stopPropagation(); toggle('idx', false); enter(i, 0, 'fwd'); });
      grid.appendChild(b);
    });
  }
  const toggle = (id, on) => $(id).classList.toggle('open', on);
  const anyOpen = () => document.querySelector('.over.open');
  let toastT;
  function toast(s) {
    const t = $('toast');
    t.textContent = s;
    t.style.opacity = 1;
    clearTimeout(toastT);
    toastT = setTimeout(() => (t.style.opacity = 0), 1100);
  }

  function keys(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if ($('black').style.display === 'block' && k !== 'F5') { $('black').style.display = 'none'; return e.preventDefault(); }
    if (k === 'Escape') { document.querySelectorAll('.over.open').forEach((o) => o.classList.remove('open')); st.typed = ''; return; }
    if (/^\d$/.test(k)) { st.typed += k; return toast('ir para ' + st.typed + ' ⏎'); }
    if (k === 'Enter' && st.typed) { const n = +st.typed; st.typed = ''; toggle('idx', false); return enter(n - 1, 0, 'fwd'); }
    st.typed = '';
    const act = {
      ArrowRight: next, PageDown: next, ' ': next, Enter: next, n: next,
      ArrowLeft: prev, PageUp: prev, Backspace: prev, p: prev,
      ArrowDown: () => enter(st.i + 1, 0, 'fwd'), ArrowUp: () => enter(st.i - 1, 0, 'back'),
      Home: () => enter(0, 0, 'fwd'), End: () => enter(defs.length - 1, 0, 'fwd'),
      r: () => enter(st.i, 0, 'fwd'),
      g: () => { toggle('help', false); $('idx').classList.toggle('open'); },
      '?': () => { toggle('idx', false); $('help').classList.toggle('open'); },
      h: () => { toggle('idx', false); $('help').classList.toggle('open'); },
      f: () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {})),
      t: () => {
        const light = document.documentElement.dataset.theme !== 'light';
        light ? (document.documentElement.dataset.theme = 'light') : delete document.documentElement.dataset.theme;
      },
      b: () => ($('black').style.display = 'block'), '.': () => ($('black').style.display = 'block'),
    }[k.length === 1 ? k.toLowerCase() : k];
    if (act) { e.preventDefault(); act(); }
  }

  function pointer() {
    stage.addEventListener('click', (e) => {
      if (anyOpen()) return void (e.target.closest('.over') === e.target && e.target.classList.remove('open'));
      if ($('black').style.display === 'block') return void ($('black').style.display = 'none');
      e.shiftKey ? prev() : next();
    });
    stage.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!anyOpen()) prev(); });
    let idle;
    addEventListener('mousemove', (e) => {
      document.body.classList.remove('nocursor');
      clearTimeout(idle);
      idle = setTimeout(() => document.body.classList.add('nocursor'), 2400);
      const tip = $('tip'), el = e.target.closest && e.target.closest('[data-tip]');
      if (!el) return void (tip.style.opacity = 0);
      const s = window.DECK_SCALE, b = stage.getBoundingClientRect();
      tip.textContent = el.getAttribute('data-tip');
      const x = (e.clientX - b.left) / s, y = (e.clientY - b.top) / s;
      tip.style.left = Math.min(x + 18, 1900 - tip.offsetWidth) + 'px';
      tip.style.top = Math.max(10, y - 52) + 'px';
      tip.style.opacity = 1;
    });
    let tx = null;
    addEventListener('touchstart', (e) => (tx = e.touches[0].clientX), { passive: true });
    addEventListener('touchend', (e) => {
      if (tx == null) return;
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
      tx = null;
    });
  }

  function start() {
    build();
    chrome();
    fit();
    if (PRINT) {
      document.body.classList.add('print');
      defs.forEach((d) => {
        d.el.classList.add('active', 'instant');
        apply(d, d.n - 1, 1);
        if (d.loop) d.loop(3.4, d.ctx, { k: d.n - 1, busy: false, last: true, still: true });
      });
      return;
    }
    addEventListener('resize', fit);
    addEventListener('keydown', keys);
    pointer();
    const m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash);
    m ? enter(+m[1] - 1, +(m[2] || 0), m[2] || INSTANT ? 'jump' : 'fwd') : enter(0, 0, 'fwd');
    if (INSTANT) { const d = defs[st.i]; apply(d, st.k, AT); }
    requestAnimationFrame(frame);
  }
  // As medidas de texto dependem das fontes embutidas: carrega antes de montar.
  const faces = ['500 60px Newsreader', 'italic 500 60px Newsreader', '500 20px "Libre Franklin"', '800 20px "Libre Franklin"', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'];
  const ready = document.fonts && document.fonts.load ? Promise.all(faces.map((f) => document.fonts.load(f))) : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 2500))]).then(start, start);
})();
</script>
</body>
</html>
